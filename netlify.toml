# Netlify Configuration for GAMESET KG Full-Stack Application

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 1. Forward all API calls to the serverless Express function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2. React SPA single-page fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
